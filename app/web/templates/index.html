<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP-Stream-Checker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>IP-Stream-Checker</h1>
            <p>流媒体解锁与IP风险检测工具</p>
        </header>
        
        <main>
            <div class="tabs">
                <button class="tab-button active" data-tab="ip-check">IP-risk检测</button>
                <button class="tab-button" data-tab="stream-test">流媒体测试</button>
                <button class="tab-button" data-tab="results">测试结果</button>
            </div>
            
            <div id="ip-check" class="tab-content active">
                <h2>IP-risk检测</h2>
                <form id="ip-check-form">
                    <div class="form-group">
                        <label for="proxy-url">代理URL:</label>
                        <input type="text" id="proxy-url" name="proxy-url" placeholder="http://proxy.example.com:port">
                    </div>
                    <div class="form-group">
                        <label for="source">数据源:</label>
                        <select id="source" name="source">
                            <option value="ping0">Ping0</option>
                            <option value="ippure">IPPure</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="timeout">超时时间(秒):</label>
                        <input type="number" id="timeout" name="timeout" value="10" min="1" max="60">
                    </div>
                    <button type="submit" class="btn">开始检测</button>
                </form>
                
                <div id="ip-results" class="results"></div>
            </div>
            
            <div id="stream-test" class="tab-content">
                <h2>流媒体解锁测试</h2>
                <form id="stream-test-form">
                    <div class="form-group">
                        <label for="providers">选择流媒体服务:</label>
                        <select id="providers" name="providers" multiple>
                            <option value="netflix">Netflix</option>
                            <option value="hulu">Hulu</option>
                            <option value="disneyplus">Disney+</option>
                            <option value="primevideo">Prime Video</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="proxy">代理URL (可选):</label>
                        <input type="text" id="proxy" name="proxy" placeholder="http://proxy.example.com:port">
                    </div>
                    <button type="submit" class="btn">开始测试</button>
                </form>
                
                <div id="stream-results" class="results"></div>
            </div>
            
            <div id="results" class="tab-content">
                <h2>测试结果</h2>
                <div id="results-list"></div>
            </div>
        </main>
        
        <footer>
            <p>© 2026 IP-Stream-Checker. All rights reserved.</p>
        </footer>
    </div>
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
