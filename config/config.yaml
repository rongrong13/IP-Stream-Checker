# IP-Stream-Checker 主配置文件

# Clash API配置
clash_api_url: "http://127.0.0.1:9090"
clash_api_secret: ""

# API基础配置
api_base_url: "http://127.0.0.1:8000"

# IP检测配置
max_queue_size: 10
max_age: 360  # 缓存有效期(秒)
request_timeout: 10  # 每个节点检测的超时时间(秒)
source: "ping0"  # 优先数据源 (ping0/ippure)
fallback: true  # 主源失败时是否尝试备用源
skip_keywords: ["剩余", "重置", "到期", "有效期", "官网", "网址", "更新", "公告", "建议"]

# 流媒体测试配置
stream_providers: ["netflix", "hulu", "disneyplus", "primevideo"]
proxy: ""  # 默认代理

# 数据目录
data_dir: "./data"

# 日志配置
log_level: "INFO"
log_file: "./logs/app.log"

# Web界面配置
web_port: 8000
web_host: "0.0.0.0"