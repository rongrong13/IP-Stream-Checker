<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP-Stream-Checker · 流媒体解锁与IP风险检测</title>
<style>
/* ============ 基础 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --panel2: #1c2333;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --cyan: #58a6ff;
  --purple: #bc8cff;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.6;
}
/* ============ 彩虹工具 ============ */
.rainbow-text {
  background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #bc8cff, #ff6b6b);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: rainbow-flow 6s linear infinite;
}
@keyframes rainbow-flow {
  0% { background-position: 0% 0; }
  100% { background-position: 300% 0; }
}
.rainbow-bar {
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #bc8cff);
  background-size: 300% 100%;
  transition: width .4s ease;
  animation: rainbow-flow 3s linear infinite;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 600; color: #fff; transition: transform .1s, opacity .2s;
  background: linear-gradient(90deg, #ff6b6b, #ffd93d 30%, #6bcb77 60%, #4d96ff);
  background-size: 200% 100%;
}
.btn:hover { opacity: .9; transform: translateY(-1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-danger { background: linear-gradient(90deg, #f85149, #d29922); }
.btn-ghost {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
}
.btn-ghost:hover { color: var(--text); border-color: var(--muted); }
/* ============ 布局 ============ */
.container { max-width: 1280px; margin: 0 auto; padding: 16px; }
header { text-align: center; padding: 26px 0 18px; }
header h1 { font-size: 30px; letter-spacing: 2px; }
header p { color: var(--muted); margin-top: 4px; }
main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
.panel {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; margin-bottom: 16px;
}
.panel-title {
  font-size: 13px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;
  display: flex; align-items: center; justify-content: space-between;
}
/* ============ 输入区 ============ */
.input-row { display: flex; gap: 10px; }
.input-row input {
  flex: 1; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--panel2); color: var(--text); font-size: 14px; outline: none;
}
.input-row input:focus { border-color: var(--cyan); }
/* ============ 设置面板 ============ */
details.settings { margin-top: 14px; }
details.settings summary {
  cursor: pointer; color: var(--cyan); font-size: 13px; user-select: none;
  padding: 6px 0;
}
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-top: 10px; }
@media (max-width: 600px) { .settings-grid { grid-template-columns: 1fr; } }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.field input, .field select {
  width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--panel2); color: var(--text); font-size: 13px; outline: none;
}
.field input[type="checkbox"] { width: auto; margin-right: 6px; }
.field.check-line { display: flex; align-items: center; gap: 6px; }
.check-line label { margin: 0; }
.providers-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px;
  margin-top: 8px;
}
.providers-grid label {
  display: flex; align-items: center; gap: 6px; padding: 5px 8px;
  border: 1px solid var(--border); border-radius: 6px; font-size: 12px; cursor: pointer;
  color: var(--muted);
}
.providers-grid label.checked { color: var(--text); border-color: var(--green); background: rgba(63,185,80,.08); }
.providers-grid input { accent-color: var(--green); }
/* ============ 状态与进度 ============ */
.status-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.badge {
  padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
  background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
}
.badge.running { color: var(--cyan); border-color: var(--cyan); animation: pulse 1.5s infinite; }
.badge.done { color: var(--green); border-color: var(--green); }
.badge.error { color: var(--red); border-color: var(--red); }
.badge.cancelled { color: var(--yellow); border-color: var(--yellow); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
.progress-wrap { background: var(--panel2); border-radius: 3px; height: 6px; overflow: hidden; flex: 1; }
.progress-text { font-size: 12px; color: var(--muted); min-width: 70px; text-align: right; }
/* ============ 日志终端 ============ */
.log-window {
  background: #010409; border: 1px solid var(--border); border-radius: 8px;
  height: 420px; overflow-y: auto; padding: 10px 12px;
  font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; font-size: 12px;
}
.log-window::-webkit-scrollbar { width: 8px; }
.log-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.log-line { padding: 2px 0; word-break: break-all; color: var(--muted); }
.log-line .t { color: #484f58; margin-right: 8px; }
.log-line.info { color: var(--muted); }
.log-line.checking { color: var(--cyan); }
.log-line.result { color: var(--green); border-left: 3px solid var(--green); padding-left: 8px; margin: 3px 0; background: rgba(63,185,80,.06); }
.log-line.cancelled { color: var(--yellow); border-left: 3px solid var(--yellow); padding-left: 8px; }
.log-line.error { color: var(--red); border-left: 3px solid var(--red); padding-left: 8px; font-weight: 600; }
.log-line.rainbow { background: linear-gradient(90deg, rgba(255,107,107,.15), rgba(255,217,61,.15), rgba(107,203,119,.15), rgba(77,150,255,.15)); }
/* ============ 完成区 ============ */
.result-row { display: flex; gap: 8px; margin-top: 12px; }
.result-row input {
  flex: 1; padding: 9px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--panel2); color: var(--green); font-size: 12px; outline: none;
}
/* ============ 历史 ============ */
.history-list { max-height: 460px; overflow-y: auto; }
.history-item {
  padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px;
  margin-bottom: 8px; cursor: pointer; transition: border-color .2s, background .2s;
}
.history-item:hover, .history-item.active { border-color: var(--cyan); background: rgba(88,166,255,.06); }
.history-item .url { font-size: 12px; color: var(--text); word-break: break-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.history-item .meta { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; justify-content: space-between; }
.history-empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 13px; }
.history-detail { margin-top: 10px; }
.history-detail pre {
  background: #010409; border: 1px solid var(--border); border-radius: 8px;
  padding: 10px; font-size: 11px; max-height: 300px; overflow: auto;
  white-space: pre-wrap; word-break: break-all; color: var(--green);
}
footer { text-align: center; color: #30363d; padding: 20px 0; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <!-- 头部 -->
  <header>
    <h1 class="rainbow-text">⚡ IP-Stream-Checker</h1>
    <p>流媒体解锁检测 + IP 风险检测 · 自动标注节点质量</p>
  </header>

  <main>
    <!-- 左: 历史记录 -->
    <aside>
      <div class="panel">
        <div class="panel-title">
          <span>📋 检测历史</span>
          <button class="btn btn-ghost" onclick="loadHistory()" style="padding:2px 10px;font-size:11px;">刷新</button>
        </div>
        <div id="history-list" class="history-list">
          <div class="history-empty">暂无记录</div>
        </div>
        <div id="history-detail" class="history-detail" style="display:none;"></div>
      </div>
    </aside>

    <!-- 右: 主操作区 -->
    <section>
      <!-- 输入区 -->
      <div class="panel">
        <div class="input-row">
          <input id="sub-url" type="text" placeholder="粘贴 Clash 订阅链接 (https://...)" />
          <button id="check-btn" class="btn" onclick="startCheck()">开始检测</button>
          <button id="stop-btn" class="btn btn-danger" onclick="stopCheck()" style="display:none;">停止</button>
        </div>

        <!-- 设置面板 -->
        <details class="settings" id="settings-panel">
          <summary>⚙️ 检测设置(数据源 · 流媒体服务开关)</summary>
          <div class="settings-grid">
            <div class="field">
              <label>IP 检测数据源</label>
              <select id="setting-source">
                <option value="ping0">Ping0</option>
                <option value="ippure">IPPure</option>
              </select>
            </div>
            <div class="field check-line">
              <label style="margin:0;white-space:nowrap;">主源失败降级</label>
              <input type="checkbox" id="setting-fallback" checked />
            </div>
            <div class="field">
              <label>IP 检测超时(秒)</label>
              <input type="number" id="setting-timeout" value="15" min="5" max="60" />
            </div>
            <div class="field">
              <label>IPPure API 地址</label>
              <input type="text" id="setting-check-url" placeholder="https://..." />
            </div>
            <div class="field">
              <label>缓存有效期(秒, 0=不缓存)</label>
              <input type="number" id="setting-max-age" value="360" min="0" />
            </div>
            <div class="field">
              <label>队列上限</label>
              <input type="number" id="setting-max-queue" value="10" min="1" max="50" />
            </div>
            <div class="field">
              <label>去除风险度高于 % 的节点(0=不过滤)</label>
              <input type="number" id="setting-risk-filter" value="0" min="0" max="100" />
            </div>
            <div class="field">
              <label>结果保留天数(0=永久)</label>
              <input type="number" id="setting-retention" value="7" min="0" max="365" />
            </div>
            <div class="field check-line">
              <label style="margin:0;white-space:nowrap;">启用流媒体解锁检测</label>
              <input type="checkbox" id="setting-stream-enabled" checked />
            </div>
            <div class="field">
              <label>流媒体检测超时(秒)</label>
              <input type="number" id="setting-stream-timeout" value="90" min="30" max="600" />
            </div>
          </div>
          <div style="margin-top:10px;">
            <label style="font-size:12px;color:var(--muted);">🎬 流媒体解锁检测服务(勾选需要检测的):</label>
            <div id="providers-grid" class="providers-grid"><!-- 动态生成 --></div>
          </div>
          <div style="margin-top:12px;">
            <button class="btn" onclick="saveSettings()">💾 保存设置</button>
            <span id="save-tip" style="margin-left:10px;font-size:12px;color:var(--green);"></span>
          </div>
        </details>
      </div>

      <!-- 状态 -->
      <div class="panel">
        <div class="status-row">
          <span id="status-badge" class="badge">空闲</span>
          <div class="progress-wrap"><div id="progress-bar" class="rainbow-bar" style="width:0%;"></div></div>
          <span id="progress-text" class="progress-text">0 / 0</span>
        </div>
        <div id="log-window" class="log-window">
          <div class="log-line info"><span class="t"></span>👋 输入订阅链接,点击"开始检测"。</div>
        </div>
        <!-- 完成区 -->
        <div id="result-row" class="result-row" style="display:none;">
          <input id="result-url" type="text" readonly />
          <button class="btn btn-ghost" onclick="copyResult()">复制</button>
          <a id="download-btn" class="btn btn-ghost" style="text-decoration:none;" target="_blank">下载</a>
        </div>
      </div>
    </section>
  </main>

  <footer>IP-Stream-Checker · 流媒体解锁 + IP 风险检测</footer>
</div>

<script>
// ============ 全局状态 ============
let evtSource = null;
let activeUrl = null;
let activeRequestId = null;
let logCount = 0; // 日志去重用

// ============ 工具 ============
function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
function ts() {
  const d = new Date();
  return d.toTimeString().slice(0, 8);
}
function addLog(msg, type) {
  const win = document.getElementById('log-window');
  const line = document.createElement('div');
  line.className = 'log-line ' + (type || 'info');
  line.innerHTML = `<span class="t">[${ts()}]</span>${escapeHtml(msg)}`;
  win.appendChild(line);
  win.scrollTop = win.scrollHeight;
  logCount++;
  // 最多保留 500 行,防止内存膨胀
  while (win.children.length > 500) win.removeChild(win.firstChild);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setBadge(text, cls) {
  const b = document.getElementById('status-badge');
  b.textContent = text;
  b.className = 'badge ' + (cls || '');
}
function setProgress(cur, total) {
  const pct = total > 0 ? Math.min(100, (cur / total) * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${cur} / ${total}`;
}

// ============ 加载设置 ============
async function loadSettings() {
  try {
    const res = await fetch('/api/settings');
    const s = await res.json();
    document.getElementById('setting-source').value = s.source || 'ping0';
    document.getElementById('setting-fallback').checked = !!s.fallback;
    document.getElementById('setting-timeout').value = s.request_timeout || 15;
    document.getElementById('setting-check-url').value = s.check_url || '';
    document.getElementById('setting-max-age').value = s.max_age ?? 360;
    document.getElementById('setting-max-queue').value = s.max_queue_size || 10;
    document.getElementById('setting-risk-filter').value = s.filter_risk_threshold ?? 0;
    document.getElementById('setting-retention').value = s.result_retention_days ?? 7;
    document.getElementById('setting-stream-enabled').checked = !!s.stream_test.enabled;
    document.getElementById('setting-stream-timeout').value = s.stream_test.timeout || 90;

    // 流媒体服务开关
    const grid = document.getElementById('providers-grid');
    grid.innerHTML = '';
    const selected = s.stream_test.providers || [];
    (s.available_providers || []).forEach(name => {
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.value = name;
      cb.checked = selected.includes(name);
      cb.addEventListener('change', () => label.classList.toggle('checked', cb.checked));
      label.appendChild(cb);
      label.appendChild(document.createTextNode(name));
      if (cb.checked) label.classList.add('checked');
      grid.appendChild(label);
    });
  } catch (e) {
    console.error('加载设置失败', e);
  }
}

async function saveSettings() {
  const selected = Array.from(document.querySelectorAll('#providers-grid input:checked')).map(i => i.value);
  const body = {
    source: document.getElementById('setting-source').value,
    fallback: document.getElementById('setting-fallback').checked,
    request_timeout: parseInt(document.getElementById('setting-timeout').value) || 15,
    check_url: document.getElementById('setting-check-url').value.trim(),
    max_queue_size: parseInt(document.getElementById('setting-max-queue').value) || 10,
    max_age: parseInt(document.getElementById('setting-max-age').value) || 0,
    filter_risk_threshold: parseInt(document.getElementById('setting-risk-filter').value) || 0,
    result_retention_days: parseInt(document.getElementById('setting-retention').value) || 7,
    stream_test: {
      enabled: document.getElementById('setting-stream-enabled').checked,
      providers: selected,
      timeout: parseInt(document.getElementById('setting-stream-timeout').value) || 90,
    }
  };
  try {
    const res = await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const tip = document.getElementById('save-tip');
    tip.textContent = res.ok ? '✅ 已保存(下次检测生效)' : '❌ 保存失败';
    setTimeout(() => tip.textContent = '', 3000);
  } catch (e) {
    alert('保存失败: ' + e.message);
  }
}

// ============ 检测流程 ============
async function startCheck() {
  const url = document.getElementById('sub-url').value.trim();
  if (!url) { alert('请先输入订阅链接'); return; }

  activeRequestId = uuid();
  activeUrl = url;

  const btn = document.getElementById('check-btn');
  const stopBtn = document.getElementById('stop-btn');
  btn.style.display = 'none';
  stopBtn.style.display = '';
  document.getElementById('result-row').style.display = 'none';
  setBadge('连接中...', 'running');
  setProgress(0, 0);
  addLog('🚀 开始检测: ' + url, 'rainbow');

  const params = new URLSearchParams();
  params.append('url', url);
  params.append('request_id', activeRequestId);
  params.append('source', document.getElementById('setting-source').value);
  params.append('fallback', document.getElementById('setting-fallback').checked);
  params.append('request_timeout', document.getElementById('setting-timeout').value);
  const maxAge = document.getElementById('setting-max-age').value;
  if (maxAge) params.append('max_age', maxAge);
  const riskFilter = document.getElementById('setting-risk-filter').value;
  if (riskFilter) params.append('filter_risk_threshold', riskFilter);

  try {
    const res = await fetch('/check?' + params.toString());
    if (res.status === 429) {
      addLog('队列已满,请稍后再试', 'error');
      resetButtons();
      return;
    }
    if (!res.ok) {
      const txt = await res.text();
      throw new Error(txt || res.statusText);
    }
    connectStream(url);
  } catch (e) {
    addLog('请求失败: ' + e.message, 'error');
    resetButtons();
  }
}

async function stopCheck() {
  if (!activeUrl) return;
  try {
    await fetch(`/cancel?url=${encodeURIComponent(activeUrl)}&request_id=${activeRequestId}`, { method: 'POST' });
    addLog('⏹️ 已发送停止请求...', 'cancelled');
  } catch (e) {
    console.error(e);
  }
}

function resetButtons() {
  document.getElementById('check-btn').style.display = '';
  document.getElementById('stop-btn').style.display = 'none';
}

function connectStream(url) {
  if (evtSource) evtSource.close();
  evtSource = new EventSource(`/status/stream?url=${encodeURIComponent(url)}`);
  setBadge('检测中...', 'running');

  evtSource.onmessage = (e) => {
    const data = JSON.parse(e.data);
    const st = data.job_status;

    if (st.status === 'unknown') {
      evtSource.close();
      setBadge('已过期', 'cancelled');
      addLog('任务数据已丢失(服务可能重启)', 'cancelled');
      resetButtons();
      return;
    }
    if (st.status === 'queued') {
      setBadge(`排队中(${data.global_queue_size})`, 'running');
      return;
    }
    if (st.status === 'running') {
      setBadge('检测中...', 'running');
    }
    setProgress(st.current || 0, st.total || 0);

    // 日志(按类型着色)
    if (st.message) {
      const msg = st.message;
      let type = 'info';
      if (msg.includes('Result:')) type = 'result';
      else if (msg.includes('Checking:')) type = 'checking';
      else if (msg.includes('Cancelled') || msg.includes('停止')) type = 'cancelled';
      else if (msg.includes('Error') || msg.includes('失败') || msg.includes('FATAL')) type = 'error';
      addLog(msg, type);
    }

    if (st.status === 'completed' || st.status === 'cancelled' || st.status === 'error') {
      evtSource.close();
      resetButtons();
      if (st.status === 'completed') {
        setBadge('✅ 完成', 'done');
        addLog('✅ 检测完成!', 'result');
        // 显示订阅链接 + 下载
        const link = `${location.origin}/check?url=${encodeURIComponent(url)}`;
        const dl = `${location.origin}/download?url=${encodeURIComponent(url)}`;
        document.getElementById('result-url').value = link;
        document.getElementById('download-btn').href = dl;
        document.getElementById('result-row').style.display = '';
        loadHistory(); // 刷新历史
      } else if (st.status === 'cancelled') {
        setBadge('已取消', 'cancelled');
      } else {
        setBadge('出错', 'error');
        if (st.error) addLog('FATAL: ' + st.error, 'error');
      }
    }
  };
  evtSource.onerror = () => {
    // EventSource 会自动重连,这里只标记
    setBadge('重连中...', 'running');
  };
}

function copyResult() {
  const input = document.getElementById('result-url');
  input.select();
  document.execCommand('copy');
  alert('已复制订阅链接');
}

// ============ 历史记录 ============
async function loadHistory() {
  try {
    const res = await fetch('/api/history?limit=50');
    const data = await res.json();
    const list = document.getElementById('history-list');
    list.innerHTML = '';
    if (!data.records || data.records.length === 0) {
      list.innerHTML = '<div class="history-empty">暂无记录</div>';
      return;
    }
    data.records.forEach(r => {
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `
        <div class="url">${escapeHtml(r.url)}</div>
        <div class="meta"><span>${escapeHtml(r.timestamp)}</span><span>${r.node_count} 节点</span></div>`;
      item.onclick = () => showHistoryDetail(r.md5, item);
      list.appendChild(item);
    });
  } catch (e) {
    console.error('加载历史失败', e);
  }
}

async function showHistoryDetail(md5, el) {
  // 高亮当前项
  document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');

  const detail = document.getElementById('history-detail');
  try {
    const res = await fetch('/api/history/' + md5);
    if (!res.ok) { detail.innerHTML = '<div class="history-empty">记录不存在或已过期</div>'; detail.style.display = ''; return; }
    const data = await res.json();
    detail.innerHTML = `
      <div class="panel-title" style="margin-top:6px;"><span>📄 ${escapeHtml(data.timestamp)}</span></div>
      <div style="font-size:12px;color:var(--muted);word-break:break-all;margin-bottom:6px;">${escapeHtml(data.url)}</div>
      <pre>${escapeHtml(data.yaml)}</pre>`;
    detail.style.display = '';
  } catch (e) {
    detail.innerHTML = '<div class="history-empty">加载失败</div>';
  }
}

// ============ 初始化 ============
loadSettings();
loadHistory();
</script>
